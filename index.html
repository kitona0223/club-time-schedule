<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチドッジボール大会管理システム (プロトタイプ)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #ff7a3d;
            --accent2: #35c9c1;
            --text: #f8fafc;
            --sub-text: #94a3b8;
            --border: #334155;
            --gold: #fbd38d;
            --line-color: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
        }
        h1 {
            font-size: 20px;
            color: var(--gold);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        /* 設定カード */
        .config-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 850px;
            margin: 0 auto 20px auto;
            text-align: left;
        }
        .config-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent2);
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 5px;
        }
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        .config-item label {
            display: block;
            font-size: 12px;
            color: var(--sub-text);
            margin-bottom: 4px;
        }
        .config-item select, .config-item input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: white;
            font-weight: bold;
        }

        /* チーム名入力エリア */
        .team-inputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }
        .team-input-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .team-input-group span {
            font-size: 12px;
            color: var(--sub-text);
            width: 24px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* セクションタイトル */
        .section-title {
            font-size: 16px;
            color: var(--accent2);
            margin: 25px auto 10px auto;
            text-align: left;
            max-width: 850px;
            border-left: 4px solid var(--accent2);
            padding-left: 8px;
        }

        /* テーブル共通 */
        table {
            width: 100%;
            max-width: 850px;
            margin: 0 auto 15px auto;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            font-size: 12px;
        }
        th, td {
            padding: 6px 4px;
            border: 1px solid var(--border);
            text-align: center;
            vertical-align: middle;
        }
        th { background: #1e293b; color: var(--sub-text); }

        .court-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
        }
        .court-A { background: #3182ce; }
        .court-B { background: #dd6b20; }

        .score-input {
            width: 38px;
            padding: 3px;
            text-align: center;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            font-weight: bold;
            border-radius: 4px;
        }

        .vpt-panel {
            margin-top: 4px;
            padding: 4px;
            background: rgba(255, 122, 61, 0.15);
            border: 1px dashed var(--accent);
            border-radius: 4px;
            display: inline-block;
        }
        .v-select {
            background: #ff7a3d;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 10px;
            font-weight: bold;
        }

        /* 星取表 */
        .matrix-table td.self-cell { background-color: #334155; }
        .win { color: var(--gold); font-weight: bold; }
        .draw { color: #94a3b8; }
        .lose { color: #f87171; }
        .stats-hdr { background-color: #0f172a; color: var(--accent2); width: 32px; }
        .rank-hdr { background-color: #0f172a; color: var(--gold); width: 40px; }

        /* トーナメント進行カードリスト */
        .tourn-card-list {
            max-width: 850px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tourn-match-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tourn-match-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--sub-text);
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }
        .tourn-match-body {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-weight: bold;
        }
        .set-scores-flex {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 6px;
            background: #0f172a;
            padding: 6px;
            border-radius: 6px;
        }

        /* 🏆 甲子園風トーナメント表（図形表示） */
        .tournament-wrapper {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }
        .tournament-tree {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            min-width: 500px;
            gap: 40px;
            padding-top: 10px;
        }
        .tree-half {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .tree-teams {
            display: flex;
            gap: 40px;
            position: relative;
        }
        .t-team-node {
            width: 100px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }
        .t-team-node.final-node {
            width: 110px;
            border-color: var(--gold);
        }
        .t-team-label {
            font-size: 10px;
            color: var(--sub-text);
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .t-team-name {
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bracket-line {
            width: 100%;
            height: 25px;
            border-top: 3px solid var(--line-color);
            border-left: 3px solid var(--line-color);
            border-right: 3px solid var(--line-color);
            margin-top: -1px;
            position: relative;
        }
        .bracket-line::after {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 20px;
            background-color: var(--line-color);
        }
        .match-score-disp {
            background: #0f172a;
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 4px 10px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 12px;
            color: #fff;
            z-index: 2;
            white-space: nowrap;
        }
        .match-score-disp.final {
            border-color: var(--gold);
        }
        .final-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }
        .final-teams-flex {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 6px;
        }
        .trophy-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <h1>🤾‍♂️ 大会管理システム (2〜8チーム汎用)</h1>

    <!-- 大会基本設定エリア -->
    <div class="config-card">
        <div class="config-title">⚙️ 大会ルール・形式設定</div>
        <div class="config-grid">
            <div class="config-item">
                <label>参加チーム数</label>
                <select id="cfg-teams" onchange="renderTeamInputs()">
                    <option value="2">2チーム</option>
                    <option value="3">3チーム</option>
                    <option value="4" selected>4チーム</option>
                    <option value="5">5チーム</option>
                    <option value="6">6チーム</option>
                    <option value="7">7チーム</option>
                    <option value="8">8チーム</option>
                </select>
            </div>
            <div class="config-item">
                <label>予選ブロック数</label>
                <select id="cfg-groups" onchange="buildApp()">
                    <option value="1">1ブロック (全員総当たり)</option>
                    <option value="2">2ブロック (A/B分け)</option>
                </select>
            </div>
            <div class="config-item">
                <label>使用コート数</label>
                <select id="cfg-courts" onchange="buildApp()">
                    <option value="1">1コート</option>
                    <option value="2">2コート (A・B同時進行)</option>
                </select>
            </div>
            <div class="config-item">
                <label>3セットマッチ採用条件</label>
                <select id="cfg-sets-rule" onchange="buildApp()">
                    <option value="semi">準決勝から (準決勝・決勝)</option>
                    <option value="final">決勝のみ</option>
                    <option value="none">全試合 1セットマッチ</option>
                </select>
            </div>
        </div>

        <div class="config-title" style="margin-top: 15px;">チーム名設定</div>
        <div id="team-inputs-container" class="team-inputs-grid">
            <!-- JSで動的生成 -->
        </div>

        <button class="btn-primary" onclick="buildApp()">大会構成を適用して再構築</button>
    </div>

    <!-- 予選タイムスケジュール -->
    <div class="section-title">📅 予選リーグ スケジュール & スコア入力</div>
    <table id="schedule-table">
        <thead>
            <tr>
                <th style="width: 70px;">コート</th>
                <th style="width: 60px;">試合</th>
                <th>対戦カード</th>
                <th style="width: 140px;">スコア (内野人数)</th>
            </tr>
        </thead>
        <tbody id="schedule-tbody">
            <!-- JSで動的生成 -->
        </tbody>
    </table>

    <!-- 予選星取表エリア -->
    <div class="section-title">⚔️ 予選対戦表（星取表）</div>
    <div id="matrix-container" style="overflow-x: auto;">
        <!-- JSで動的生成 -->
    </div>

    <!-- 決勝トーナメント入力エリア -->
    <div class="section-title">📝 決勝トーナメント スコア入力</div>
    <div id="tournament-container" class="tourn-card-list">
        <!-- JSで動的生成 -->
    </div>

    <!-- 🏆 甲子園風 決勝トーナメント表（図形表示） -->
    <div class="section-title">🏆 決勝トーナメント表（図）</div>
    <div class="tournament-wrapper">
        <!-- 頂点：決勝戦 -->
        <div class="final-center">
            <div class="trophy-title">🥇 決勝戦</div>
            <div class="final-teams-flex">
                <div class="t-team-node final-node">
                    <span class="t-team-label" id="t-final-lblA">準決勝1勝者</span>
                    <span class="t-team-name" id="t-final-teamA">-</span>
                </div>
                <div class="match-score-disp final" id="disp-final-score">- vs -</div>
                <div class="t-team-node final-node">
                    <span class="t-team-label" id="t-final-lblB">準決勝2勝者</span>
                    <span class="t-team-name" id="t-final-teamB">-</span>
                </div>
            </div>
        </div>

        <!-- トーナメント山図 -->
        <div class="tournament-tree">
            <!-- 左の山（準決勝1） -->
            <div class="tree-half">
                <div class="match-score-disp" id="disp-semi1-score">- vs -</div>
                <div class="bracket-line"></div>
                <div class="tree-teams">
                    <div class="t-team-node">
                        <span class="t-team-label" id="t-semi1-lblA">予選1位</span>
                        <span class="t-team-name" id="t-semi1-a">-</span>
                    </div>
                    <div class="t-team-node">
                        <span class="t-team-label" id="t-semi1-lblB">予選4位</span>
                        <span class="t-team-name" id="t-semi1-b">-</span>
                    </div>
                </div>
            </div>

            <!-- 右の山（準決勝2） -->
            <div class="tree-half">
                <div class="match-score-disp" id="disp-semi2-score">- vs -</div>
                <div class="bracket-line"></div>
                <div class="tree-teams">
                    <div class="t-team-node">
                        <span class="t-team-label" id="t-semi2-lblA">予選2位</span>
                        <span class="t-team-name" id="t-semi2-a">-</span>
                    </div>
                    <div class="t-team-node">
                        <span class="t-team-label" id="t-semi2-lblB">予選3位</span>
                        <span class="t-team-name" id="t-semi2-b">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            teams: [],
            groups: [],
            matches: []
        };

        // 初期表示時：チーム名入力フィールドの生成
        function renderTeamInputs() {
            const count = parseInt(document.getElementById('cfg-teams').value, 10);
            const container = document.getElementById('team-inputs-container');
            let html = '';
            for (let i = 0; i < count; i++) {
                const defaultName = `チーム${String.fromCharCode(65 + i)}`;
                const existingVal = document.getElementById(`team-in-${i}`)?.value || defaultName;
                html += `
                    <div class="team-input-group">
                        <span>T${i+1}</span>
                        <input type="text" id="team-in-${i}" value="${existingVal}" placeholder="チーム名">
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // 大会全体の再構築
        function buildApp() {
            const teamCount = parseInt(document.getElementById('cfg-teams').value, 10);
            state.teams = [];
            for (let i = 0; i < teamCount; i++) {
                const val = document.getElementById(`team-in-${i}`)?.value;
                state.teams.push(val || `チーム${String.fromCharCode(65 + i)}`);
            }

            const groupCount = parseInt(document.getElementById('cfg-groups').value, 10);
            state.groups = [];
            if (groupCount === 1) {
                state.groups.push({ name: '予選', teams: state.teams.map((_, i) => i) });
            } else {
                const half = Math.ceil(teamCount / 2);
                state.groups.push({ name: 'Aグループ', teams: state.teams.map((_, i) => i).slice(0, half) });
                state.groups.push({ name: 'Bグループ', teams: state.teams.map((_, i) => i).slice(half) });
            }

            buildSchedule();
            renderMatrix();
            buildTournamentInputs();
            calculateAll();
        }

        // 予選スケジュールの生成 (総当たり)
        function buildSchedule() {
            const courtCount = parseInt(document.getElementById('cfg-courts').value, 10);
            state.matches = [];
            let matchId = 0;

            state.groups.forEach((grp, gIdx) => {
                const tList = grp.teams;
                for (let i = 0; i < tList.length; i++) {
                    for (let j = i + 1; j < tList.length; j++) {
                        state.matches.push({
                            id: matchId++,
                            groupIndex: gIdx,
                            groupName: grp.name,
                            teamA: tList[i],
                            teamB: tList[j],
                            court: (matchId % courtCount === 1 || courtCount === 1) ? 'A' : 'B'
                        });
                    }
                }
            });

            const tbody = document.getElementById('schedule-tbody');
            tbody.innerHTML = '';
            state.matches.forEach((m, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="court-badge court-${m.court}">${m.court}コート</span></td>
                    <td>第${idx + 1}試合<br><span style="font-size:9px; color:var(--sub-text);">${m.groupName}</span></td>
                    <td>${state.teams[m.teamA]} vs ${state.teams[m.teamB]}</td>
                    <td>
                        <input type="number" class="score-input" id="s_${m.id}_a" onchange="calculateAll()" min="0"> - 
                        <input type="number" class="score-input" id="s_${m.id}_b" onchange="calculateAll()" min="0">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 星取表の描画
        function renderMatrix() {
            const container = document.getElementById('matrix-container');
            container.innerHTML = '';

            state.groups.forEach((grp) => {
                let html = `<h4 style="text-align:left; color:var(--gold); margin:10px 0 5px 0;">■ ${grp.name}</h4>`;
                html += `<table class="matrix-table"><thead><tr><th>チーム</th>`;
                grp.teams.forEach(tIdx => {
                    html += `<th>${state.teams[tIdx]}</th>`;
                });
                html += `<th class="stats-hdr">勝</th><th class="stats-hdr">分</th><th class="stats-hdr">負</th><th class="stats-hdr">勝点</th><th class="stats-hdr">自内野</th><th class="stats-hdr">相内野</th><th class="rank-hdr">順位</th></tr></thead><tbody>`;

                grp.teams.forEach(rIdx => {
                    html += `<tr><td style="font-weight:bold;">${state.teams[rIdx]}</td>`;
                    grp.teams.forEach(cIdx => {
                        if (rIdx === cIdx) {
                            html += `<td class="self-cell">-</td>`;
                        } else {
                            html += `<td id="m_cell_${rIdx}_${cIdx}">-</td>`;
                        }
                    });
                    html += `<td id="st_w_${rIdx}">0</td><td id="st_d_${rIdx}">0</td><td id="st_l_${rIdx}">0</td>
                             <td id="st_pts_${rIdx}" style="font-weight:bold; color:var(--gold);">0</td>
                             <td id="st_myin_${rIdx}" style="font-weight:bold; color:var(--accent2);">0</td>
                             <td id="st_oppin_${rIdx}">0</td>
                             <td id="st_rank_${rIdx}" style="font-weight:bold;">-</td></tr>`;
                });

                html += `</tbody></table>`;
                container.innerHTML += html;
            });
        }

        // 決勝トーナメント入力欄の構築 (条件に応じたセット数の判定)
        function buildTournamentInputs() {
            const container = document.getElementById('tournament-container');
            container.innerHTML = '';
            
            const setsRule = document.getElementById('cfg-sets-rule').value;
            const isSemi3Sets = (setsRule === 'semi');
            const isFinal3Sets = (setsRule === 'semi' || setsRule === 'final');

            let html = `
                <div class="tourn-match-card">
                    <div class="tourn-match-header">
                        <span>🏆 準決勝 第1試合</span>
                        <span>${isSemi3Sets ? '3セットマッチ' : '1セットマッチ'}</span>
                    </div>
                    <div class="tourn-match-body">
                        <span id="t_m1_ta">準決1(左)</span>
                        <span style="color:var(--sub-text); font-size:12px;"> vs </span>
                        <span id="t_m1_tb">準決1(右)</span>
                    </div>
                    ${renderSetInputs('m1', isSemi3Sets)}
                </div>

                <div class="tourn-match-card">
                    <div class="tourn-match-header">
                        <span>🏆 準決勝 第2試合</span>
                        <span>${isSemi3Sets ? '3セットマッチ' : '1セットマッチ'}</span>
                    </div>
                    <div class="tourn-match-body">
                        <span id="t_m2_ta">準決2(左)</span>
                        <span style="color:var(--sub-text); font-size:12px;"> vs </span>
                        <span id="t_m2_tb">準決2(右)</span>
                    </div>
                    ${renderSetInputs('m2', isSemi3Sets)}
                </div>

                <div class="tourn-match-card" style="border-color: var(--gold);">
                    <div class="tourn-match-header">
                        <span style="color:var(--gold); font-weight:bold;">🥇 決勝戦</span>
                        <span>${isFinal3Sets ? '3セットマッチ' : '1セットマッチ'}</span>
                    </div>
                    <div class="tourn-match-body">
                        <span id="t_mf_ta">決勝(左)</span>
                        <span style="color:var(--sub-text); font-size:12px;"> vs </span>
                        <span id="t_mf_tb">決勝(右)</span>
                    </div>
                    ${renderSetInputs('mf', isFinal3Sets)}
                </div>
            `;
            container.innerHTML = html;
        }

        function renderSetInputs(matchKey, is3Sets) {
            const setsCount = is3Sets ? 3 : 1;
            let html = '<div class="set-scores-flex">';
            for (let s = 1; s <= setsCount; s++) {
                html += `
                    <div style="font-size:10px;">
                        Set${s}<br>
                        <input type="number" class="score-input" id="ts_${matchKey}_s${s}_a" onchange="calculateAll()" min="0"> - 
                        <input type="number" class="score-input" id="ts_${matchKey}_s${s}_b" onchange="calculateAll()" min="0">
                        <div id="v_${matchKey}_s${s}_panel" class="vpt-panel" style="display:none;">
                            <select id="v_${matchKey}_s${s}_win" class="v-select" onchange="calculateAll()">
                                <option value="">Vpt</option>
                                <option value="A">左勝</option>
                                <option value="B">右勝</option>
                            </select>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            return html;
        }

        // トーナメント1試合分の勝敗・表示用文字列計算
        function getTournMatchResult(matchKey, is3Sets, teamA, teamB) {
            const setsCount = is3Sets ? 3 : 1;
            let winA = 0, winB = 0;
            let setDetails = [];

            for (let s = 1; s <= setsCount; s++) {
                const saEl = document.getElementById(`ts_${matchKey}_s${s}_a`);
                const sbEl = document.getElementById(`ts_${matchKey}_s${s}_b`);
                const panel = document.getElementById(`v_${matchKey}_s${s}_panel`);
                const vSelect = document.getElementById(`v_${matchKey}_s${s}_win`);

                if (saEl && sbEl && saEl.value !== '' && sbEl.value !== '') {
                    const sa = parseInt(saEl.value, 10);
                    const sb = parseInt(sbEl.value, 10);

                    if (sa > sb) {
                        winA++;
                        if (panel) panel.style.display = 'none';
                        setDetails.push(`${sa}-${sb}`);
                    } else if (sb > sa) {
                        winB++;
                        if (panel) panel.style.display = 'none';
                        setDetails.push(`${sa}-${sb}`);
                    } else {
                        // 同点 ➜ Vpt発生
                        if (panel) panel.style.display = 'inline-block';
                        const vWin = vSelect ? vSelect.value : '';
                        const loserScore = sa - 1 >= 0 ? sa - 1 : 0;
                        if (vWin === 'A') {
                            winA++;
                            setDetails.push(`${sa}v(${sa})-(${sb})${loserScore}`);
                        } else if (vWin === 'B') {
                            winB++;
                            setDetails.push(`${loserScore}(${sa})-(${sb})${sb}v`);
                        } else {
                            setDetails.push(`${sa}-${sb}(Vpt未決)`);
                        }
                    }
                }
            }

            let dispText = '- vs -';
            let winner = '-', loser = '-';

            if (setDetails.length > 0) {
                if (is3Sets) {
                    dispText = `(${winA}) ${setDetails.join(' / ')} (${winB})`;
                    if (winA >= 2) { winner = teamA; loser = teamB; }
                    else if (winB >= 2) { winner = teamB; loser = teamA; }
                } else {
                    dispText = setDetails[0];
                    if (winA > winB) { winner = teamA; loser = teamB; }
                    else if (winB > winA) { winner = teamB; loser = teamA; }
                }
            }

            return { winner, loser, dispText };
        }

        // 全体の計算・自動更新処理
        function calculateAll() {
            // 1. 集計初期化
            let stats = state.teams.map((name, i) => ({ id: i, name, pts: 0, win: 0, draw: 0, lose: 0, myIn: 0, oppIn: 0, rank: 0 }));

            // 2. 予選スコア集計
            state.matches.forEach(m => {
                const saEl = document.getElementById(`s_${m.id}_a`);
                const sbEl = document.getElementById(`s_${m.id}_b`);
                const cellA = document.getElementById(`m_cell_${m.teamA}_${m.teamB}`);
                const cellB = document.getElementById(`m_cell_${m.teamB}_${m.teamA}`);

                if (saEl && sbEl && saEl.value !== '' && sbEl.value !== '') {
                    const sa = parseInt(saEl.value, 10);
                    const sb = parseInt(sbEl.value, 10);

                    stats[m.teamA].myIn += sa; stats[m.teamA].oppIn += sb;
                    stats[m.teamB].myIn += sb; stats[m.teamB].oppIn += sa;

                    if (sa > sb) {
                        stats[m.teamA].pts += 2; stats[m.teamA].win++;
                        stats[m.teamB].lose++;
                        if (cellA) cellA.innerHTML = `<span class="win">〇</span> <br><span style="font-size:9px;">${sa}-${sb}</span>`;
                        if (cellB) cellB.innerHTML = `<span class="lose">✕</span> <br><span style="font-size:9px;">${sb}-${sa}</span>`;
                    } else if (sb > sa) {
                        stats[m.teamB].pts += 2; stats[m.teamB].win++;
                        stats[m.teamA].lose++;
                        if (cellA) cellA.innerHTML = `<span class="lose">✕</span> <br><span style="font-size:9px;">${sa}-${sb}</span>`;
                        if (cellB) cellB.innerHTML = `<span class="win">〇</span> <br><span style="font-size:9px;">${sb}-${sa}</span>`;
                    } else {
                        stats[m.teamA].pts += 1; stats[m.teamA].draw++;
                        stats[m.teamB].pts += 1; stats[m.teamB].draw++;
                        if (cellA) cellA.innerHTML = `<span class="draw">△</span> <br><span style="font-size:9px;">${sa}-${sb}</span>`;
                        if (cellB) cellB.innerHTML = `<span class="draw">△</span> <br><span style="font-size:9px;">${sb}-${sa}</span>`;
                    }
                }
            });

            // 集計値を星取表に反映
            stats.forEach(st => {
                const w = document.getElementById(`st_w_${st.id}`);
                if (w) {
                    document.getElementById(`st_w_${st.id}`).innerText = st.win;
                    document.getElementById(`st_d_${st.id}`).innerText = st.draw;
                    document.getElementById(`st_l_${st.id}`).innerText = st.lose;
                    document.getElementById(`st_pts_${st.id}`).innerText = st.pts;
                    document.getElementById(`st_myin_${st.id}`).innerText = st.myIn;
                    document.getElementById(`st_oppin_${st.id}`).innerText = st.oppIn;
                }
            });

            // 順位ソート (勝点 ➜ 自内野)
            let sorted = [...stats].sort((a,b) => b.pts - a.pts || b.myIn - a.myIn);
            sorted.forEach((st, idx) => {
                const rEl = document.getElementById(`st_rank_${st.id}`);
                if (rEl) rEl.innerText = `${idx + 1}位`;
            });

            // 3. 決勝トーナメントの計算と図形への反映
            const setsRule = document.getElementById('cfg-sets-rule').value;
            const isSemi3Sets = (setsRule === 'semi');
            const isFinal3Sets = (setsRule === 'semi' || setsRule === 'final');

            // チーム名（1位vs4位、2位vs3位）
            let semi1A = sorted[0] ? sorted[0].name : '-';
            let semi1B = sorted[3] ? sorted[3].name : (sorted[1] ? sorted[1].name : '-');
            let semi2A = sorted[1] ? sorted[1].name : '-';
            let semi2B = sorted[2] ? sorted[2].name : '-';

            document.getElementById('t_m1_ta').innerText = semi1A;
            document.getElementById('t_m1_tb').innerText = semi1B;
            document.getElementById('t-semi1-a').innerText = semi1A;
            document.getElementById('t-semi1-b').innerText = semi1B;

            document.getElementById('t_m2_ta').innerText = semi2A;
            document.getElementById('t_m2_tb').innerText = semi2B;
            document.getElementById('t-semi2-a').innerText = semi2A;
            document.getElementById('t-semi2-b').innerText = semi2B;

            // 準決勝1 & 2 計算
            const resM1 = getTournMatchResult('m1', isSemi3Sets, semi1A, semi1B);
            const resM2 = getTournMatchResult('m2', isSemi3Sets, semi2A, semi2B);

            document.getElementById('disp-semi1-score').innerText = resM1.dispText;
            document.getElementById('disp-semi2-score').innerText = resM2.dispText;

            // 決勝戦 チーム名反映
            let finalA = resM1.winner !== '-' ? resM1.winner : '準勝1勝者';
            let finalB = resM2.winner !== '-' ? resM2.winner : '準勝2勝者';

            document.getElementById('t_mf_ta').innerText = finalA;
            document.getElementById('t_mf_tb').innerText = finalB;
            document.getElementById('t-final-teamA').innerText = finalA;
            document.getElementById('t-final-teamB').innerText = finalB;

            // 決勝戦 計算
            const resMF = getTournMatchResult('mf', isFinal3Sets, finalA, finalB);
            document.getElementById('disp-final-score').innerText = resMF.dispText;
        }

        // 初期セットアップ
        renderTeamInputs();
        buildApp();
    </script>
</body>
